<!doctype html>
<html lang="en">

<head>
    <script>
        // Runs before first paint. React only applies the saved theme once the
        // sidebar mounts, so without this every load painted light first and
        // then flipped to dark for users on the dark theme.
        (function () {
            try {
                // The login page is light only, so it never takes the class.
                // Covers a direct hit; LoginPage handles arriving from inside
                // the app, and hands the theme back on the way out.
                if (/\/login\/?$/.test(window.location.pathname)) return
                var theme = localStorage.getItem('theme')
                if (!theme) {
                    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
                }
                document.documentElement.classList.toggle('dark', theme === 'dark')
            } catch (e) {
                // Storage blocked (private mode); the default theme stands.
            }
        })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#080e18" />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="mit panel" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MIT Panel</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
